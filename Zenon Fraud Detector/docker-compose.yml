services:
  mysql:
    image: mysql:8.4
    container_name: zenon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zenon_bank
      MYSQL_USER: zenon
      MYSQL_PASSWORD: zenon123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: